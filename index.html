<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trixie Web - HTML</title>
    <link rel="stylesheet" href="trixiecss.css">
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <!-- LZ-String for compression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
</head>
<body>
<div class="logo">Trixie</div>
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-buttons">
            <button class="navbtn" onclick="switchMode('html')">HTML</button>
            <button class="navbtn" onclick="switchMode('css')">CSS</button>
            <button class="navbtn" onclick="switchMode('js')">JS</button>
            <button class="navbtn" onclick="saveAsUniversal()">Save As</button>
            <button class="navbtn" onclick="openUniversal()">Open</button>
            <!-- NEW SYNC BUTTONS -->
            <button class="navbtn" onclick="generateSyncCode()">Generate Sync Code</button>
            <button class="navbtn" onclick="enterSyncCode()">Enter Sync Code</button>
        </div>
    </div>
</nav>
<div id="split-container" style="display:flex; height: calc(100% - 100px);">
    <div id="editor" style="width:50%; height:100%;"></div>
    <iframe id="preview" style="width:50%; height:100%; background:white; border:none;"></iframe>
</div>
<script>
    const PROJECT = "trixieProject";
    let editor;
    let currentFileHandle = null;
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    /* ------------------ SYNC STORAGE (LOCALSTORAGE) ------------------ */
    function getSyncStore() {
        const raw = localStorage.getItem("trixieSyncStore");
        return raw ? JSON.parse(raw) : {};
    }
    function saveSyncStore(store) {
        localStorage.setItem("trixieSyncStore", JSON.stringify(store));
    }
    function generateSyncCode() {
        const html = localStorage.getItem(PROJECT + "_html") || "";
        const css = localStorage.getItem(PROJECT + "_css") || "";
        const js = localStorage.getItem(PROJECT + "_js") || "";
        const bundle = JSON.stringify({ html, css, js });
        const compressed = LZString.compressToBase64(bundle);
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        const expiresAt = Date.now() + (10 * 60 * 1000); // 10 minutes
        const store = getSyncStore();
        store[code] = { compressed, expiresAt };
        saveSyncStore(store);
        alert("Your sync code is: " + code + "\nValid for 10 minutes.");
    }
    function enterSyncCode() {
        const code = prompt("Enter sync code:");
        if (!code) return;
        const store = getSyncStore();
        const entry = store[code];
        if (!entry) {
            alert("Invalid code or no data found.");
            return;
        }
        if (Date.now() > entry.expiresAt) {
            delete store[code];
            saveSyncStore(store);
            alert("This code has expired.");
            return;
        }
        const bundle = JSON.parse(LZString.decompressFromBase64(entry.compressed));
        localStorage.setItem(PROJECT + "_html", bundle.html);
        localStorage.setItem(PROJECT + "_css", bundle.css);
        localStorage.setItem(PROJECT + "_js", bundle.js);
        editor.setValue(bundle.html);
        updatePreview();
        alert("Project synced successfully!");
        delete store[code];
        saveSyncStore(store);
    }
    /* ------------------ AUTOSAVE + AUTOLOAD ------------------ */
    function saveToLocal() {
        localStorage.setItem(PROJECT + "_html", editor.getValue());
    }
    function loadFromLocal() {
        return localStorage.getItem(PROJECT + "_html") || "";
    }
    /* ------------------ INIT EDITOR ------------------ */
    window.onload = function () {
        editor = CodeMirror(document.getElementById("editor"), {
            lineNumbers: true,
            mode: "htmlmixed",
            theme: "monokai"
        });
        editor.setValue(loadFromLocal());
        updatePreview();
        editor.on("change", () => {
            saveToLocal();
            updatePreview();
        });
    };
    /* ------------------ FULL PROJECT PREVIEW ------------------ */
    function updatePreview() {
        const html = editor.getValue();
        const css = localStorage.getItem(PROJECT + "_css") || "";
        const js = localStorage.getItem(PROJECT + "_js") || "";
        const iframe = document.getElementById("preview");
        iframe.srcdoc = `
            <html>
            <head>
                <style>${css}</style>
            </head>
            <body>
                ${html}
                <script>${js}<\/script>
            </body>
            </html>
        `;
    }
    /* ------------------ TAB SWITCHING ------------------ */
    function switchMode(mode) {
        const pages = {
            html: "index.html",
            css: "css.html",
            js: "js.html"
        };
        window.location.assign(pages[mode]);
        setTimeout(() => window.location.href = pages[mode], 50);
    }
    /* ------------------ FILENAME HELPERS ------------------ */
    function extractTitle(html) {
        const match = html.match(/<title>(.*?)<\/title>/i);
        return match ? match[1].trim() : "index";
    }
    function extractCSS(html) {
        const match = html.match(/<link[^>]+href=["']([^"']+)["']/i);
        return match ? match[1].trim() : "trixiecss.css";
    }
    function extractJS(html) {
        const match = html.match(/<script[^>]+src=["']([^"']+)["']/i);
        return match ? match[1].trim() : "script.js";
    }
    /* ------------------ SAVE AS ------------------ */
    async function saveAsUniversal() {
        const html = editor.getValue();
        const filename = extractTitle(html) + ".html";
        if (isSafari || !window.showSaveFilePicker) {
            const blob = new Blob([html], { type: "text/html" });
            const link = document.createElement("a");
            link.download = filename;
            link.href = URL.createObjectURL(blob);
            link.click();
            alert("Saved! On iPad, find it in Files → Downloads.");
            return;
        }
        try {
            const options = {
                suggestedName: filename,
                types: [{
                    description: "HTML Files",
                    accept: { "text/html": [".html"] }
                }]
            };
            currentFileHandle = await window.showSaveFilePicker(options);
            const writable = await currentFileHandle.createWritable();
            await writable.write(html);
            await writable.close();
            alert("Saved successfully!");
        } catch (err) {
            console.log("Save As failed:", err);
        }
    }
    /* ------------------ OPEN ------------------ */
    async function openUniversal() {
        if (isSafari || !window.showOpenFilePicker) {
            const input = document.createElement("input");
            input.type = "file";
            input.onchange = async e => {
                const file = e.target.files[0];
                const text = await file.text();
                editor.setValue(text);
                saveToLocal();
                updatePreview();
            };
            input.click();
            return;
        }
        try {
            const [fileHandle] = await window.showOpenFilePicker({
                types: [{
                    description: "HTML Files",
                    accept: { "text/html": [".html"] }
                }]
            });
            currentFileHandle = fileHandle;
            const file = await fileHandle.getFile();
            const text = await file.text();
            editor.setValue(text);
            saveToLocal();
            updatePreview();
        } catch (err) {
            console.log("Open failed:", err);
        }
    }
</script>
</body>
</html>
