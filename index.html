<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trixie Web - HTML</title>

    <!-- External CSS (you keep this separate) -->
    <link rel="stylesheet" href="trixiecss.css">

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
</head>

<body>

<div class="logo">Trixie</div>

<nav class="navbar">
    <div class="nav-container">
        <div class="nav-buttons">
            <button class="navbtn" onclick="switchMode('html')">HTML</button>
            <button class="navbtn" onclick="switchMode('css')">CSS</button>
            <button class="navbtn" onclick="saveAsReal()">Save As</button>
            <button class="navbtn" onclick="openReal()">Open</button>
        </div>
    </div>
</nav>

<!-- Split container -->
<div id="split-container" style="display:flex; height: calc(100% - 100px);">

    <!-- Left side: CodeMirror editor -->
    <div id="editor" style="width:50%; height:100%;"></div>

    <!-- Right side: Live preview -->
    <iframe id="preview" style="width:50%; height:100%; background:white; border:none;"></iframe>

</div>

<script>
    let editor;
    let currentMode = "html";
    let currentFileHandle = null; // ⭐ For real Save (overwrite)

    // Initialize CodeMirror
    window.onload = function () {
        editor = CodeMirror(document.getElementById("editor"), {
            lineNumbers: true,
            mode: "htmlmixed",
            theme: "monokai"
        });

        currentMode = "html";

        editor.on("change", updatePreview);
    };

    // Update preview iframe
    function updatePreview() {
        const iframe = document.getElementById("preview");
        const code = editor.getValue();
        iframe.srcdoc = code;
    }

    // Switch between HTML / CSS / JS pages
    function switchMode(mode) {
        currentMode = mode;

        if (mode === "html") window.location.href = "index.html";
        if (mode === "css") window.location.href = "css.html";
        if (mode === "js") window.location.href = "js.html";
    }

    // ⭐ REAL SAVE AS — opens tablet file browser
    async function saveAsReal() {
        try {
            const options = {
                suggestedName:
                    currentMode === "html" ? "index.html" :
                    currentMode === "css"  ? "style.css" :
                                              "script.js",
                types: [{
                    description: "Text Files",
                    accept: { "text/plain": [".html", ".css", ".js"] }
                }]
            };

            currentFileHandle = await window.showSaveFilePicker(options);
            const writable = await currentFileHandle.createWritable();
            await writable.write(editor.getValue());
            await writable.close();

            alert("Saved successfully!");
        } catch (err) {
            console.log("Save As canceled or failed:", err);
        }
    }

    // ⭐ REAL SAVE — overwrites existing file
    async function saveReal() {
        if (!currentFileHandle) {
            return saveAsReal();
        }

        try {
            const writable = await currentFileHandle.createWritable();
            await writable.write(editor.getValue());
            await writable.close();

            alert("Saved!");
        } catch (err) {
            console.log("Save failed:", err);
        }
    }

    // ⭐ REAL OPEN — opens file browser
    async function openReal() {
        try {
            const [fileHandle] = await window.showOpenFilePicker({
                types: [{
                    description: "Text Files",
                    accept: { "text/plain": [".html", ".css", ".js"] }
                }]
            });

            currentFileHandle = fileHandle;

            const file = await fileHandle.getFile();
            const text = await file.text();

            editor.setValue(text);
            updatePreview();
        } catch (err) {
            console.log("Open canceled or failed:", err);
        }
    }

    // Service worker registration
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js")
            .then(() => console.log("Service Worker Registered"))
            .catch(err => console.log("SW Error:", err));
    }
</script>

</body>
</html>
